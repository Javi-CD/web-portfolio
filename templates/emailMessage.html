<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuevo mensaje de contacto</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.6;
        color: #333;
        background-color: #f4f4f4;
      }

      .container {
        max-width: 600px;
        margin: 20px auto;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #374151, #4b5563);
        color: white;
        padding: 30px 20px;
        text-align: center;
      }

      .header h1 {
        font-size: 24px;
        margin-bottom: 5px;
        font-weight: 600;
      }

      .header p {
        opacity: 0.9;
        font-size: 14px;
      }

      .content {
        padding: 30px;
      }

      .message-info {
        background: #f8fafc;
        border-left: 4px solid #3b82f6;
        padding: 20px;
        margin-bottom: 25px;
        border-radius: 0 8px 8px 0;
      }

      .info-row {
        display: flex;
        margin-bottom: 12px;
        align-items: center;
      }

      .info-row:last-child {
        margin-bottom: 0;
      }

      .info-label {
        font-weight: 600;
        color: #374151;
        min-width: 80px;
        margin-right: 15px;
      }

      .info-value {
        color: #6b7280;
        flex: 1;
      }

      .message-content {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 20px;
        margin-top: 20px;
      }

      .message-content h3 {
        color: #374151;
        margin-bottom: 15px;
        font-size: 18px;
        border-bottom: 2px solid #e5e7eb;
        padding-bottom: 8px;
      }

      .message-text {
        color: #4b5563;
        line-height: 1.7;
        white-space: pre-wrap;
        font-size: 15px;
      }

      .footer {
        background: #f9fafb;
        padding: 20px;
        text-align: center;
        border-top: 1px solid #e5e7eb;
      }

      .footer p {
        color: #6b7280;
        font-size: 13px;
        margin-bottom: 10px;
      }

      .badge {
        display: inline-block;
        background: #3b82f6;
        color: white;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 500;
      }

      .divider {
        height: 1px;
        background: linear-gradient(
          to right,
          transparent,
          #e5e7eb,
          transparent
        );
        margin: 25px 0;
      }

      @media (max-width: 600px) {
        .container {
          margin: 10px;
          border-radius: 8px;
        }

        .content {
          padding: 20px;
        }

        .header {
          padding: 20px;
        }

        .info-row {
          flex-direction: column;
          align-items: flex-start;
        }

        .info-label {
          margin-bottom: 5px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <div class="header">
        <h1>New Contact Message</h1>
        <p>You have received a message from your web portfolio</p>
      </div>

      <!-- Content -->
      <div class="content">
        <div class="message-info">
          <div class="info-row">
            <span class="info-label">From:</span>
            <span class="info-value"><strong>{{from_name}}</strong></span>
          </div>
          <div class="info-row">
            <span class="info-label">Email:</span>
            <span class="info-value">{{from_email}}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Affair:</span>
            <span class="info-value"><strong>{{subject}}</strong></span>
          </div>
          <div class="info-row">
            <span class="info-label">Date:</span>
            <span class="info-value">{{date}}</span>
          </div>
        </div>

        <div class="divider"></div>

        <div class="message-content">
          <h3>Message:</h3>
          <div class="message-text">{{message}}</div>
        </div>
      </div>

      <!-- Footer -->
      <div class="footer">
        <p>This message was sent from your web portfolio contact form.</p>
        <span class="badge">Portfolio - Javier Pérez</span>
      </div>
    </div>
  </body>
</html>
